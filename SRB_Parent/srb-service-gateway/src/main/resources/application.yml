server:
  port: 80 # 服务端口

spring:
  profiles:
    active: dev # 环境设置
  application:
    name: srb-service-gateway # 服务名
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 # nacos服务地址
    gateway:
      discovery:
        locator:
          enabled: true # gateway可以发现nacos中的微服务，并自动生成转发路由

      routes:
        - id: srb-service-core
          uri: lb://service-core
          predicates:
            - Path=/*/core/**
        - id: srb-service-sms
          uri: lb://service-sms
          predicates:
            - Path=/*/sms/**
        - id: srb-service-oss
          uri: lb://service-oss
          predicates:
            - Path=/*/oss/**